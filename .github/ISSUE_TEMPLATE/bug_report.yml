name: 🐞 Bug Report
description: Something is broken? Tell us about it.
title: "bug: "
labels: ["🐞❔ unconfirmed bug"]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead? Screenshots or a screen recording help a lot.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How can we reproduce it?
      description: Rough steps are fine — where you were, what you clicked. Skip this if you're not sure.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
