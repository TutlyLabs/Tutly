name: Deploy API App Preview

env:
  TURBO_FORCE: ${{ contains(github.event.pull_request.labels.*.name, 'disable cache') && 'true' || '' }}

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/**"
      - "tooling/**"
      - "turbo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    name: Deploy API App Preview
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Build API app with Turbo
        run: pnpm turbo run build --filter=api

      - name: Verify build output
        run: |
          if [ ! -d "apps/api/dist" ]; then
            echo "Build failed: apps/api/dist not found"
            exit 1
          fi
          echo "Build output present"

      - name: Deploy to Vercel
        id: deploy
        uses: ./tooling/github/vercel-deploy
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          environment: preview
          working-directory: apps/api

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = "🚀 **API App Preview Deployed!**";
            const comment = `${marker}\n\n**Preview URL:** ${process.env.DEPLOYMENT_URL}\n\nThis deployment was triggered by changes to the API app.`;

            const existingComments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const botComment = existingComments.find(
              (c) => c.body.includes(marker) && c.user.login === "github-actions[bot]"
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
