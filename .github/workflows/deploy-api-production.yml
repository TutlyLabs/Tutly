name: Deploy API App to Production

env:
  TURBO_FORCE: ${{ github.event_name == 'workflow_dispatch' && contains(github.event.inputs.labels, 'disable cache') && 'true' || '' }}

on:
  push:
    tags:
      - "api@*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API App to Production
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Build API app with Turbo
        run: pnpm turbo run build --filter=api

      - name: Verify build output
        run: |
          if [ ! -d "apps/api/dist" ]; then
            echo "Build failed: apps/api/dist not found"
            exit 1
          fi
          echo "Build output present"

      - name: Deploy to Vercel
        id: deploy
        uses: ./tooling/github/vercel-deploy
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          environment: production
          working-directory: apps/api
