name: Publish playground runner images

on:
  push:
    branches: [main]
    paths:
      - "apps/playground-runners/**"
      - "packages/playground-agent/**"
      - "packages/playground-protocol/**"
      - ".github/workflows/playground-runners.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - node
          - python
          - cpp
          - java
          - postgres
          - sqlite
          - static-web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/playground-runner-${{ matrix.image }}"
          # Lowercase the repo owner (GHCR requires lowercase).
          IMG_LOWER=$(echo "$IMG" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tags=${IMG_LOWER}:latest,${IMG_LOWER}:sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/playground-runners/${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=playground-runner-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=playground-runner-${{ matrix.image }}
