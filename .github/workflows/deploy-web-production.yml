name: Deploy Web App to Production

on:
  push:
    tags:
      - "web@*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and push Web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and push image
        uses: ./tooling/github/docker-publish
        with:
          image: ghcr.io/${{ github.repository_owner }}/tutly-web
          dockerfile: apps/web/Dockerfile
          tag-pattern: web@(.*)
          cache-scope: web
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy Web App to Production
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Trigger Coolify deploy
        uses: ./tooling/github/coolify-trigger
        with:
          webhook: ${{ secrets.COOLIFY_WEBHOOK_WEB }}
          token: ${{ secrets.COOLIFY_TOKEN }}
