name: Deploy Runner Orchestrator to Production

# Builds orchestrator + browser-runner images from the same tag so they stay in sync.

on:
  push:
    tags:
      - "runner-orchestrator@*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and push Runner Orchestrator images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout Sandpack fork (prebuilt bundler)
        uses: actions/checkout@v7
        with:
          repository: TutlyLabs/sandbox
          ref: prebuilt-bundler
          path: sandbox
          token: ${{ secrets.SANDBOX_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Vendor Sandpack bundler into web/public
        run: |
          mkdir -p apps/web/public/sandpack
          cp -a sandbox/www/. apps/web/public/sandpack/
          du -sh apps/web/public/sandpack
          ls apps/web/public/sandpack | head -5

      - name: Build and push browser runner image
        uses: ./tooling/github/docker-publish
        with:
          image: ghcr.io/${{ github.repository_owner }}/tutly-browser-runner
          dockerfile: apps/runner-orchestrator/Dockerfile.browser
          tag-pattern: runner-orchestrator@(.*)
          cache-scope: browser
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Orchestrator image
        uses: ./tooling/github/docker-publish
        with:
          image: ghcr.io/${{ github.repository_owner }}/tutly-runner-orchestrator
          dockerfile: apps/runner-orchestrator/Dockerfile
          tag-pattern: runner-orchestrator@(.*)
          cache-scope: orch
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy Runner Orchestrator to Production
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Trigger Coolify deploy
        uses: ./tooling/github/coolify-trigger
        with:
          webhook: ${{ secrets.COOLIFY_WEBHOOK_RUNNER_ORCHESTRATOR }}
          token: ${{ secrets.COOLIFY_TOKEN }}
