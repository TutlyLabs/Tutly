name: Deploy Runner Orchestrator to Production

# Builds orchestrator + browser-runner images from the same tag so they stay in sync.

on:
  push:
    tags:
      - "runner-orchestrator@*"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy Runner Orchestrator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout Sandpack fork (prebuilt bundler)
        uses: actions/checkout@v4
        with:
          repository: TutlyLabs/sandbox
          ref: prebuilt-bundler
          path: sandbox
          token: ${{ secrets.SANDBOX_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Vendor Sandpack bundler into web/public
        run: |
          mkdir -p apps/web/public/sandpack
          cp -a sandbox/www/. apps/web/public/sandpack/
          du -sh apps/web/public/sandpack
          ls apps/web/public/sandpack | head -5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Browser runner image metadata
        id: meta-browser
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tutly-browser-runner
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=match,pattern=runner-orchestrator@(.*),group=1

      - name: Build and push browser runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/runner-orchestrator/Dockerfile.browser
          push: true
          tags: ${{ steps.meta-browser.outputs.tags }}
          labels: ${{ steps.meta-browser.outputs.labels }}
          cache-from: type=gha,scope=browser
          cache-to: type=gha,mode=max,scope=browser

      - name: Orchestrator image metadata
        id: meta-orch
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tutly-runner-orchestrator
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=match,pattern=runner-orchestrator@(.*),group=1

      - name: Build and push Orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/runner-orchestrator/Dockerfile
          push: true
          tags: ${{ steps.meta-orch.outputs.tags }}
          labels: ${{ steps.meta-orch.outputs.labels }}
          cache-from: type=gha,scope=orch
          cache-to: type=gha,mode=max,scope=orch

      - name: Deploy to Coolify
        env:
          COOLIFY_WEBHOOK_RUNNER_ORCHESTRATOR: ${{ secrets.COOLIFY_WEBHOOK_RUNNER_ORCHESTRATOR }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          RESPONSE=$(curl --request GET "${COOLIFY_WEBHOOK_RUNNER_ORCHESTRATOR}" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --silent --show-error --fail)

          if [ $? -eq 0 ]; then
            echo "Deployment triggered successfully"
            echo "Response: $RESPONSE"
          else
            echo "Deployment failed"
            exit 1
          fi
