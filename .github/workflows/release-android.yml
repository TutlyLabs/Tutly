name: Release Android APK

on:
  push:
    tags:
      - "web@*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing web release tag to build, e.g. "web@4.7.0".'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup
        uses: ./tooling/github/setup

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret not set — Firebase will be unconfigured in this APK and push notifications will be dormant."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > apps/web/android/app/google-services.json
          echo "Wrote apps/web/android/app/google-services.json ($(wc -c < apps/web/android/app/google-services.json) bytes)"

      - name: Build Android APK
        run: pnpm -F web release:android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          VERSION=$(node -p "require('./apps/web/package.json').version")
          APK="apps/web/tutly-${VERSION}.apk"
          if [ ! -f "$APK" ]; then
            echo "No APK at $APK — the build step did not produce one."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading APK as a new asset."
            gh release upload "$TAG" "$APK" --clobber
          else
            echo "Release $TAG does not exist. (Changesets should have created it)."
            NOTES="$(awk '/^## /{n++} n==1{print} n>1{exit}' apps/web/CHANGELOG.md 2>/dev/null || echo "Tutly Android v${VERSION}")"
            gh release create "$TAG" "$APK" --title "$TAG" --notes "$NOTES"
          fi
