name: Deploy Landing App to Production

env:
  TURBO_FORCE: ${{ github.event_name == 'workflow_dispatch' && contains(github.event.inputs.labels, 'disable cache') && 'true' || '' }}

on:
  push:
    tags:
      - "landing@*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Landing App to Production
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Deploy to Vercel
        id: deploy
        uses: ./tooling/github/vercel-deploy
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          environment: production
