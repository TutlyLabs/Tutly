name: Deploy Video Worker to Production

on:
  push:
    tags:
      - "video-worker@*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and push Video Worker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and push image
        uses: ./tooling/github/docker-publish
        with:
          image: ghcr.io/${{ github.repository_owner }}/tutly-video-worker
          dockerfile: packages/video-worker/Dockerfile
          tag-pattern: video-worker@(.*)
          cache-scope: video-worker
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy Video Worker to Production
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Trigger Coolify deploy
        uses: ./tooling/github/coolify-trigger
        with:
          webhook: ${{ secrets.COOLIFY_WEBHOOK_VIDEO_WORKER }}
          token: ${{ secrets.COOLIFY_TOKEN }}
