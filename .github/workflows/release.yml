name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Refs pushed with the default GITHUB_TOKEN never trigger other
      # workflows, so the version tags Changesets pushes here could not start
      # the `on: push: tags:` production deploys. A GitHub App token can.
      # Simpler alternative if you do not want to run a GitHub App: create a
      # classic PAT with `repo` + `workflow` scopes, store it as
      # secrets.RELEASE_TOKEN, drop this step, and use
      # ${{ secrets.RELEASE_TOKEN }} in both places below.
      - name: Generate release token
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Both uses below fall back to GITHUB_TOKEN until the App is configured,
      # so this workflow stays green. Tags pushed with the fallback will NOT
      # trigger the production deploys — that is the whole reason the App
      # exists. See docs/ci-remediation.md.

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup
        uses: ./tooling/github/setup

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
